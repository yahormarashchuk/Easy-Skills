name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  EASY_SKILLS_ALLOW_CLIENT_PROBES: '0'
  EASY_SKILLS_ALLOW_EXTERNAL: '0'
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm pack --ignore-scripts
