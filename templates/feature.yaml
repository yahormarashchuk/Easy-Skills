# Replace sample IDs with the exact configurations verified through your official CLI.
# No model alias is resolved by Easy Skills. DEFINE records your current CLI/model.
schemaVersion: 2
featureId: example-feature
title: Example feature
spec: |
  Describe user behavior, scope, constraints and feature acceptance criteria.
project:
  schemaVersion: 2
  name: Example project
  repository: owner/repository
  mainBranch: main
  remote: origin
  githubTransport: gh
  mergePolicy:
    mode: strict
    requiredChecks:
      - name: YOUR_REQUIRED_GITHUB_CHECK_NAME
  checks:
    - id: test
      command: npm
      args: [test]
      timeoutMs: 300000
assignments:
  DEFINE: {provider: codex, model: YOUR_CURRENT_EXACT_MODEL_ID}
  PLAN: {provider: codex, model: YOUR_EXACT_MODEL_ID}
  BUILD: {provider: codex, model: YOUR_EXACT_MODEL_ID}
  VERIFY: {provider: codex, model: YOUR_EXACT_MODEL_ID}
  REVIEW: {provider: claude-code, model: YOUR_EXACT_MODEL_ID}
  SHIP: {provider: codex, model: YOUR_EXACT_MODEL_ID}
tasks:
  - id: first-slice
    title: Deliver first behavior
    description: Implement a small vertical slice.
    dependsOn: []
    scope:
      areas: [api]
      paths: [src/api/]
    acceptance: [Observable behavior has meaningful automated coverage.]
rulesHash: REPLACE_WITH_OUTPUT_OF_RULES_HASH
rulesAgreement:
  version: 2
  hash: REPLACE_WITH_REVIEWED_AGREEMENT_HASH
runnerVersion: 0.1.0-alpha.2
skillsVersion: 0.1.0-alpha.2
permissions:
  publishIssues: true
  mergeIntermediate: true

repairPolicy: {maxCompletedAttempts: 3}
# Generated by feature plan from the reviewed project; inspect exact file hashes.
protectedInputs: {}
